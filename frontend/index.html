<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameTrack — Recomendación y análisis de videojuegos</title>
    <meta
      name="description"
      content="Plataforma inteligente de recomendación y análisis de videojuegos basada en comportamiento de usuarios y reseñas."
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <!-- El logo real. El apple-touch va sobre el violeta de marca porque iOS
         ignora la transparencia y compondría el caldero sobre negro. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <style>
      /* El tema guardado se aplica antes de pintar para no ver un destello
         del tema equivocado al cargar. */
      .quiz-label,
      .account-trigger-label {
        display: inline;
      }
      @media (max-width: 860px) {
        .quiz-label,
        .account-trigger-label {
          display: none;
        }
      }
    </style>
    <script>
      // Antes del primer pintado: evita el destello de tema.
      try {
        const stored = localStorage.getItem("gametrack.theme");
        if (stored) document.documentElement.dataset.theme = stored;
      } catch (_) {}
    </script>
  </head>
  <body>
    <header class="app-header">
      <!-- El logo real, no un dibujo aproximado: el humo entrelazado ES la G
           y la T de GameTrack, así que simplificarlo tira justo la idea de la
           marca. A 36px las dos letras todavía se distinguen. Las medidas van
           explícitas para que el header no salte mientras carga la imagen, y
           `aria-hidden` porque el texto "GameTrack" de al lado ya la nombra. -->
      <a class="brand" id="brand-link" href="#/">
        <img
          class="brand-mark"
          src="/assets/brand/logo.png"
          width="36"
          height="36"
          alt=""
          aria-hidden="true"
        />
        <span>GameTrack</span>
      </a>
      <nav class="main-nav" id="nav" aria-label="Navegación principal"></nav>
      <div class="header-search" id="header-search"></div>
      <div class="header-actions" id="actions"></div>
    </header>

    <main class="app-main" id="view"></main>

    <script type="module" src="/js/app.js?v=2"></script>
  </body>
</html>
