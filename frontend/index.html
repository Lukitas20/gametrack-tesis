<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameTrack — Recomendación y análisis de videojuegos</title>
    <meta
      name="description"
      content="Plataforma inteligente de recomendación y análisis de videojuegos basada en comportamiento de usuarios y reseñas."
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/steam-profile.css" />
    <link rel="stylesheet" href="/css/experience.css?v=console-1" />
    <link rel="stylesheet" href="/css/console.css?v=console-1" />
    <link rel="stylesheet" href="/css/living.css?v=score-2" />
    <link rel="stylesheet" href="/css/player-hub.css?v=hub-1" />
    <!-- El logo real. El apple-touch va sobre el violeta de marca porque iOS
         ignora la transparencia y compondría el caldero sobre negro. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <style>
      /* El tema guardado se aplica antes de pintar para no ver un destello
         del tema equivocado al cargar. */
      .quiz-label,
      .account-trigger-label {
        display: inline;
      }
      @media (max-width: 860px) {
        .quiz-label,
        .account-trigger-label {
          display: none;
        }
      }
    </style>
    <script>
      // Antes del primer pintado: evita el destello de tema.
      try {
        const stored = localStorage.getItem("gametrack.theme");
        if (stored) document.documentElement.dataset.theme = stored;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div class="app-ambient" aria-hidden="true"><span class="ambient-spark"></span><span class="ambient-spark"></span><span class="ambient-spark"></span><span class="ambient-spark"></span><span class="ambient-spark"></span><span class="ambient-spark"></span><span class="ambient-spark"></span><span class="ambient-spark"></span></div>
    <header class="app-header">
      <!-- El logo real, no un dibujo aproximado: el humo entrelazado ES la G
           y la T de GameTrack, así que simplificarlo tira justo la idea de la
           marca. A 36px las dos letras todavía se distinguen. Las medidas van
           explícitas para que el header no salte mientras carga la imagen, y
           `aria-hidden` porque el texto "GameTrack" de al lado ya la nombra. -->
      <a class="brand" id="brand-link" href="#/" aria-label="GameTrack">
        <img
          class="brand-mark"
          src="/assets/brand/logo.png"
          width="36"
          height="36"
          alt=""
          aria-hidden="true"
        />
        <span>GameTrack</span>
      </a>

      <div class="header-search" id="header-search"></div>
      <div class="header-actions" id="actions"></div>
      <nav class="main-nav" id="nav" aria-label="Navegación principal"></nav>
    </header>

    <main class="app-main" id="view"></main>

    <!-- Una versión compartida evita mezclar módulos nuevos con la caché anterior. -->
    <script type="importmap">
      { "imports": {
        "/js/ui.js": "/js/ui.js?v=player-hub-20261001-r3",
        "/js/motion.js": "/js/motion.js?v=player-hub-20261001-r3",
        "/js/views/profile.js": "/js/views/profile.js?v=player-hub-20261001-r3",
        "/js/views/steam-achievements.js": "/js/views/steam-achievements.js?v=player-hub-20261001-r3",
        "/js/api.js": "/js/api.js?v=player-hub-20261001-r3",
        "/js/views/game.js": "/js/views/game.js?v=player-hub-20261001-r3",
        "/js/store.js": "/js/store.js?v=player-hub-20261001-r3",
        "/js/views/auth.js": "/js/views/auth.js?v=player-hub-20261001-r3",
        "/js/views/friends.js": "/js/views/friends.js?v=player-hub-20261001-r3",
        "/js/views/quiz.js": "/js/views/quiz.js?v=player-hub-20261001-r3",
        "/js/views/recommendations.js": "/js/views/recommendations.js?v=player-hub-20261001-r3",
        "/js/views/steam-profile.js": "/js/views/steam-profile.js?v=player-hub-20261001-r3",
        "/js/views/steam-friends.js": "/js/views/steam-friends.js?v=player-hub-20261001-r3"
      } }
    </script>
    <script type="module" src="/js/app.js?v=player-hub-20261001-r3"></script>
  </body>
</html>
