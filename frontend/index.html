<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameTrack — Recomendación y análisis de videojuegos</title>
    <meta
      name="description"
      content="Plataforma inteligente de recomendación y análisis de videojuegos basada en comportamiento de usuarios y reseñas."
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='16' font-weight='800' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* El tema guardado se aplica antes de pintar para no ver un destello
         del tema equivocado al cargar. */
      .quiz-label,
      .account-trigger-label {
        display: inline;
      }
      @media (max-width: 860px) {
        .quiz-label,
        .account-trigger-label {
          display: none;
        }
      }
    </style>
    <script>
      // Antes del primer pintado: evita el destello de tema.
      try {
        const stored = localStorage.getItem("gametrack.theme");
        if (stored) document.documentElement.dataset.theme = stored;
      } catch (_) {}
    </script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">GT</span>
        <span>GameTrack</span>
      </a>
      <nav class="main-nav" id="nav" aria-label="Navegación principal"></nav>
      <div class="header-search" id="header-search"></div>
      <div class="header-actions" id="actions"></div>
    </header>

    <main class="app-main" id="view"></main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
