<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameTrack — Recomendación y análisis de videojuegos</title>
    <meta
      name="description"
      content="Plataforma inteligente de recomendación y análisis de videojuegos basada en comportamiento de usuarios y reseñas."
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <!-- El caldero, dibujado en vectores en vez de un PNG escalado: a 16px
         un raster del logo real se empasta, y el humo entrelazado del arte
         original desaparece igual. Acá va una sola voluta en vez de dos.
         Los colores son literales (un data: URI no ve las variables de la
         página) y usan el violeta levantado, que se sostiene tanto sobre una
         pestaña clara como oscura. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 10.5C13 7 19.5 5.5 17 1.5' fill='none' stroke='%23108890' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M25.5 4.2l1 2.1 2.1 1-2.1 1-1 2.1-1-2.1-2.1-1 2.1-1z' fill='%23d8a040'/%3E%3Cellipse cx='16' cy='20' rx='10.5' ry='8.5' fill='%238b6ea8'/%3E%3Cellipse cx='16' cy='13' rx='11.5' ry='3' fill='%238b6ea8'/%3E%3Cellipse cx='16' cy='12.6' rx='8.5' ry='2' fill='%23108890'/%3E%3Cpath d='M16 17.6l2.3 2.7-2.3 2.7-2.3-2.7z' fill='%23d8a040'/%3E%3C/svg%3E"
    />
    <style>
      /* El tema guardado se aplica antes de pintar para no ver un destello
         del tema equivocado al cargar. */
      .quiz-label,
      .account-trigger-label {
        display: inline;
      }
      @media (max-width: 860px) {
        .quiz-label,
        .account-trigger-label {
          display: none;
        }
      }
    </style>
    <script>
      // Antes del primer pintado: evita el destello de tema.
      try {
        const stored = localStorage.getItem("gametrack.theme");
        if (stored) document.documentElement.dataset.theme = stored;
      } catch (_) {}
    </script>
  </head>
  <body>
    <header class="app-header">
      <!-- El caldero va inline (no como <img>) para que sus rellenos puedan
           leer las variables del tema: el violeta de marca desaparece contra
           el header oscuro y necesita levantarse. `aria-hidden` porque el
           texto "GameTrack" de al lado ya nombra la marca. -->
      <a class="brand" href="#/">
        <svg
          class="brand-mark"
          viewBox="0 0 32 32"
          width="30"
          height="30"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M16 10.5C13 7 19.5 5.5 17 1.5"
            fill="none"
            stroke="var(--brand-teal-ui)"
            stroke-width="2.2"
            stroke-linecap="round"
          />
          <path d="M25.5 4.2l1 2.1 2.1 1-2.1 1-1 2.1-1-2.1-2.1-1 2.1-1z" fill="var(--brand-gold-ui)" />
          <ellipse cx="16" cy="20" rx="10.5" ry="8.5" fill="var(--brand-mark-body)" />
          <ellipse cx="16" cy="13" rx="11.5" ry="3" fill="var(--brand-mark-body)" />
          <ellipse cx="16" cy="12.6" rx="8.5" ry="2" fill="var(--brand-teal-ui)" />
          <path d="M16 17.6l2.3 2.7-2.3 2.7-2.3-2.7z" fill="var(--brand-gold-ui)" />
        </svg>
        <span>GameTrack</span>
      </a>
      <nav class="main-nav" id="nav" aria-label="Navegación principal"></nav>
      <div class="header-search" id="header-search"></div>
      <div class="header-actions" id="actions"></div>
    </header>

    <main class="app-main" id="view"></main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
